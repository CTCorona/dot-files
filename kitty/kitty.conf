# Font Configuration
font_family      CaskaydiaCove Nerd Font Propo
font_size        12.0

# Window Configuration
hide_window_decorations yes
window_padding_width    12
# Note: kitty uses a single value for both x and y padding, or you can specify
# window_padding_width 12 20  (vertical horizontal)
background_opacity      0.95
background_blur         32

# Cursor Configuration
cursor_shape      block
cursor_blink_interval 0.5

# Scrollback
scrollback_lines  3023

# Terminal features
mouse_hide_wait   3.0
copy_on_select    yes
confirm_os_window_close 0

# Key bindings
map ctrl+shift+n  new_os_window
map ctrl+t        new_tab
map ctrl+equal    change_font_size all +1.0
map ctrl+minus    change_font_size all -1.0
map ctrl+0        change_font_size all 0

# Material 3 UI elements
# unfocused-split-opacity equivalent
inactive_text_alpha 0.7
# unfocused-split-fill: kitty uses active/inactive border colors instead
# inactive_border_color #44464f

# Tab configuration (no titlebar equivalent is handled by hide_window_decorations)

# Shell integration
shell_integration enabled

# Single instance: use kitty's --single-instance flag at launch instead
# kitty --single-instance

# Theme
include themes/Matugen.conf

# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME
