# : Manager [[[

[mgr]
cwd = { fg = "#{{teal.hex}}" }

# Tab - Estilo limpio y plano
tab_active = { fg = "#{{onPrimaryContainer.hex}}", bg = "#{{primaryContainer.hex}}", bold = true }
tab_inactive = { fg = "#{{onSurfaceVariant.hex}}", bg = "#{{surfaceContainer.hex}}" }
tab_width = 1

# Marker
marker_copied = { fg = "#{{success.hex}}", bg = "#{{success.hex}}" }
marker_cut = { fg = "#{{red.hex}}", bg = "#{{red.hex}}" }
marker_marked = { fg = "#{{sky.hex}}", bg = "#{{sky.hex}}" }
marker_selected = { fg = "#{{tertiary.hex}}", bg = "#{{tertiary.hex}}" }

# Border - Línea fina para separar columnas
border_symbol = "│"
border_style  = { fg = "#{{outlineVariant.hex}}" }

# : ]]]

# : Status [[[

[status]
separator_open = ""
separator_close = ""
separator_style = { bg = "#{{surfaceContainer.hex}}", fg = "#{{surfaceContainer.hex}}" }

[mode]
normal_main = { bg = "#{{primary.hex}}", fg = "#{{onPrimary.hex}}", bold = true }
normal_alt  = { bg = "#{{surfaceVariant.hex}}", fg = "#{{primary.hex}}" }

# Permissions - Siguiendo el esquema drwxr-xr-x de la foto
permissions_t = { fg = "#{{green.hex}}" }
permissions_w = { fg = "#{{yellow.hex}}" }
permissions_x = { fg = "#{{sky.hex}}" }
permissions_r = { fg = "#{{peach.hex}}" }
permissions_s = { fg = "#{{subtext0.hex}}" }

# : ]]]

# : File-specific styles [[[

[filetype]

rules = [
    # 1. Directorios primero (para que tengan ese azul cyan vibrante)
    { name = "*/", fg = "#{{sky.hex}}", bold = true },

    # 2. Ejecutables (el verde de 'opfor-linux')
    { name = "*", is = "exec", fg = "#{{green.hex}}", bold = true },

    # 3. Imágenes (favicon.png -> morado/lavanda)
    { mime = "image/*", fg = "#{{mauve.hex}}" },

    # 4. Documentos (PDFs -> rojo/naranja)
    { mime = "application/pdf", fg = "#{{red.hex}}" },
    { mime = "application/{doc,rtf,txt}", fg = "#{{red.hex}}" },

    # 5. Archivos comprimidos (Zip/Tar -> amarillo/marrón)
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#{{maroon.hex}}" },

    # 6. Media
    { mime = "{audio,video}/*", fg = "#{{yellow.hex}}" },

    # Special files
    { name = "*", is = "orphan", bg = "#{{errorContainer.hex}}", fg = "#{{onErrorContainer.hex}}" },

    # Fallback (Solo para lo que no encaje en nada de lo anterior)
    { name = "*", fg = "#{{text.hex}}" },
]

# : ]]]

# : Resto de secciones (Select, Input, Help) [[[
[select]
border = { fg = "#{{primary.hex}}" }
active = { fg = "#{{tertiary.hex}}", bold = true }

[input]
border = { fg = "#{{primary.hex}}" }
value = { fg = "#{{onSurface.hex}}" }

[help]
on = { fg = "#{{primary.hex}}" }
run = { fg = "#{{tertiary.hex}}" }
footer = { fg = "#{{onSurface.hex}}", bg = "#{{surfaceContainer.hex}}" }
# : ]]]
